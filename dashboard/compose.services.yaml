services:
  collector:
    build: ./services/collector
    env_file: .env.collector
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  fabric-gateway:
    profiles: [fabric]
    build: ./services/fabric-gateway
    env_file: .env.fabric
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8081"]
    volumes: ["./secrets/fabric:/certs:ro"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
